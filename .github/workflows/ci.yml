name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build, test, lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test must fail the job in minutes, not hold a runner for the
    # 6-hour default (as a macOS PTY test once did).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # fmt is platform-independent, so only run it once (on Linux) to save time.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  cargo-deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit
      # cargo audit fails on vulnerabilities. The --ignore IDs below are advisories
      # we have triaged and accepted (kept in sync with deny.toml's advisories.ignore):
      #   RUSTSEC-2025-0069  daemonize is unmaintained; no safe upgrade exists.
      #   RUSTSEC-2022-0015  false positive: matches our local `pty` crate by name,
      #                      not the unrelated crates.io `pty` crate.
      #   RUSTSEC-2018-0015  false positive: matches our local `term` crate by name,
      #                      not the unrelated crates.io `term` crate.
      - name: cargo audit
        run: >
          cargo audit
          --ignore RUSTSEC-2025-0069
          --ignore RUSTSEC-2022-0015
          --ignore RUSTSEC-2018-0015
