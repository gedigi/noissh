name: Benchmark

# noissh vs OpenSSH over loopback impaired by netem (delay and packet loss),
# which needs root and a kernel with sch_netem: a GitHub runner has both. The
# results go to the job summary. It takes about ten minutes of runner time,
# so it runs only on demand: Actions → Benchmark → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  netem:
    name: noissh vs ssh under netem
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install OpenSSH server, iproute2, ethtool
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server iproute2 ethtool
          # sshd refuses to start without its privilege-separation directory.
          sudo mkdir -p /run/sshd
          sudo modprobe sch_netem || true
      - name: Build
        run: cargo build --release --workspace --bins
      - name: Benchmark
        run: |
          set -o pipefail
          bench/netem.sh 20 | tee results.md
          {
            echo "## noissh vs OpenSSH (netem on loopback, 20 MB bulk)"
            echo
            cat results.md
          } >> "$GITHUB_STEP_SUMMARY"
